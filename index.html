<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen – Delicious Food & Fast Delivery</title>
    <meta name="description" content="Order delicious meals online from our restaurant kitchen. Fresh ingredients, fast delivery, and a variety of dishes.">
    <meta name="keywords" content="restaurant, online food, delivery, pizza, burgers, healthy meals, kitchen, order online">
    <meta name="author" content="Step Ordering Kitchen">
    <link rel="icon" href="./photo/girl.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./restoran.css">
</head>
<body>
    <header class="content">
        <div class="kitoll">
            <a href="#" class="brand-logo">
                <img src="./photo/oooo1.png" class="kit" alt="Restaurant Logo">
                 <div class="brand">
                    <a href="./index.html" class="brand-text">Home</a>
                </div>
            </a>
            <div class="conteriner">    
                <nav id="mainNav">
                    <div class="allregistracion">
                        <button id="themeToggle" title="Change Theme" aria-label="Toggle Theme">
                            ☀️ 🌑
                        </button>
                        <button id="registerBtn" class="btn-secondary"><a href="register.html">Registre</a></button>
                        <button id="authBtn" class="btn-primary"><a href="./auth.html">auth</a></button>
                        <button id="closeBurger" class="closeBurger" aria-label="Close menu">❌</button>
                    </div>
                </nav>
                <button id="burger" class="burger" aria-label="Open menu">☰</button>
                <div class="cart" onclick="openCart()" id="cartCount" title="View Cart">🛒</div>
                <div id="cartModal" class="cart-modal">
                    <div class="cart-drawer">
                        <div class="cart-top">
                            <div class="imgcart">
                                <img src="./photo/kkkkkkk.png" class="cartimg" alt="Kitchen Icon">
                                <p class="cart1">Cart</p>
                            </div>
                            <span onclick="closeCart()" class="close" title="Close Cart">×</span>
                        </div>
                        <div id="cartItems"></div>
                        <div class="title">
                            <h3 id="cartTotal">Total: 0$</h3>
                            <div style="display: flex; gap: 0.75rem; width: 100%;">
                                <button onclick="clearCart()" class="delete-all" style="flex: 1;">Delete All</button>
                                <button onclick="openCheckout()" class="checkout" style="flex: 1.5;">Check Out</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="checkoutModal" class="modal">
                    <div class="modal-content1">
                        <button onclick="closeCheckout()" class="cancel" title="Close Checkout">❌</button>
                        <h2>Payment</h2>
                        <p id="checkoutTotal"></p>
                        <input placeholder="Card Number (demo)" class="number">
                        <div class="cvc1">
                            <input placeholder="MM/YY" class="cvc">
                            <input placeholder="CVC" class="cvc">
                        </div>
                        <button onclick="confirmPayment()" class="pay">Pay</button>
                        <p id="paymentStatus"></p>
                    </div>
                </div>
            </div>
        </header>
        <section class="rest">
            <div class="hero-content-box">
                <img src="./photo/shef.png" class="shef">
                <span class="hero-pill-badge">⚡ Fresh & Delicious</span>
                <p class="fast">Fast and efficient, online ordering you must try.</p>
            </div>
        </section>
        <main>
            <div class="all1">
                <h1>Categories</h1>
                <div><img src="./photo/kkkkkkk.png" class="kitchen" alt="Chef Hat"></div>
            </div>
            <section id="section"></section>
            <div class="inbox">
                <div id="filter">
                    <h3>filter</h3>
                    <label class="search">Search
                        <input type="text" id="filterName" class="search1" placeholder="Search...">
                    </label>
                    <label class="vegetarian">Vegetarian
                        <input type="checkbox" id="filterVegeterian">
                    </label>
                    <label class="nuts">Nuts
                        <input type="checkbox" id="filterNuts">
                    </label>
                    <label class="spices">Spiciness
                        <select id="filterSpiciness">
                            <option value="0">All</option>
                            <option value="1">🌶️</option>
                            <option value="2">🌶️🌶️</option>
                            <option value="3">🌶️🌶️🌶️</option>
                            <option value="4">🌶️🌶️🌶️🌶️</option>
                            <option value="5">🌶️🌶️🌶️🌶️🌶️</option>
                        </select>
                    </label>
                    <label class="minprice">Min Price ($)
                        <input type="number" id="filterMinPrice" min="0" placeholder="0" class="pricemin">
                    </label>

                    <label class="maxprice">Max Price ($)
                        <input type="number" id="filterMaxPrice" min="0" placeholder="100" class="pricemax">
                    </label>

                    <button id="removeFilters">Remove</button>
                </div>
                <div class="foodconteiner">
                    <div id="food"></div>
                    <div id="pagination"></div>
                </div>
            </div>
        </main>
        <footer>
            <div class="step">
                <p class="step1">© Step Ordering 2026, All rights reserved</p>
            </div>
        </footer>
    <script src="./restoran.js"></script>
    </body>
</html>
